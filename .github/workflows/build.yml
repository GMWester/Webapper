name: Build WebApper (Linux)
run-name: "WebApper Linux · ${{ github.event_name == 'workflow_dispatch' && 'release' || github.event_name }} · ${{ github.ref_name }}"

on:
  push:
    branches: [linux]
    tags: ["linux-v*"]
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: write

# Release version: a manual run publishes the release <branch>-v$VERSION.
env:
  VERSION: "1.1.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end smoke test (real Firefox + real add-on)
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-0 libdbus-glib-1-2 libasound2 libx11-xcb1 || true
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/.local/share"
          mkdir -p "$HOME"
          python main.py create https://example.com --name "Example" \
            --ext https://addons.mozilla.org/en-US/firefox/addon/ublock-origin/ \
            --mode portable --dest "$RUNNER_TEMP/out"
          APP="$RUNNER_TEMP/out/Example"
          ls -la "$APP" "$APP/profile/extensions"
          "$APP/runtime/firefox/firefox" --headless --profile "$APP/profile" --screenshot "$RUNNER_TEMP/shot.png" https://example.com
          test -s "$RUNNER_TEMP/shot.png"
          python main.py create https://example.com --name "Example Local" --mode local --no-desktop-shortcut
          python main.py list
          ls "$XDG_DATA_HOME/applications"
      - name: Real window test (add-ons button visible, add-on active)
        run: |
          sudo apt-get install -y xvfb imagemagick
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          export DISPLAY=:99 HOME="$RUNNER_TEMP/home"
          APP="$RUNNER_TEMP/out/Example"
          "$APP/run.sh" &
          sleep 30
          import -window root "$RUNNER_TEMP/window.png"
          echo "TOPSTRIP-BEGIN"
          convert "$RUNNER_TEMP/window.png" -crop 1280x120+0+0 -colors 64 png:- | base64 -w 120
          echo "TOPSTRIP-END"
          pkill -f "$APP/runtime/firefox" || true
          sleep 3
          python tests/check_addon_active.py "$APP/profile"
          cat "$APP/profile/chrome/userChrome.css"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-screenshot-${{ matrix.arch }}
          path: ${{ runner.temp }}/window.png
      - name: Build binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --name webapper-linux-${{ matrix.arch }} \
            --collect-submodules webapper main.py
          cp packaging/webapper.desktop dist/
          ./dist/webapper-linux-${{ matrix.arch }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: webapper-linux-${{ matrix.arch }}
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-v{1}', github.ref_name, env.VERSION) }}
          name: WebApper ${{ github.ref_name }} ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/webapper-linux-${{ matrix.arch }}
