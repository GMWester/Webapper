name: Build WebApper (Android TV)
run-name: "WebApper Android TV · ${{ github.event_name == 'workflow_dispatch' && 'release' || github.event_name }} · ${{ github.ref_name }}"

on:
  push:
    branches: [android-tv]
    tags: ["android-tv-v*"]
  pull_request:
    branches: [android-tv]
  workflow_dispatch:

permissions:
  contents: write

# Release version: a manual run publishes the release <branch>-v$VERSION.
env:
  VERSION: "1.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Unit tests (generate + sign an app from the real GeckoView template)
        run: gradle --no-daemon :app:testX86_64DebugUnitTest
      - name: Inspect generated APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging app/build/generated-test/generated.apk | head -20
          "$BT/apksigner" verify --verbose app/build/generated-test/generated.apk
      - name: Build installer APKs
        run: gradle --no-daemon :app:assembleRelease
      - name: Collect
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$f")")")
            cp "$f" "dist/WebApper-androidtv-${flavor}.apk"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: webapper-android-tv
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: generated-test-app
          path: app/build/generated-test/generated.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-v{1}', github.ref_name, env.VERSION) }}
          name: WebApper ${{ github.ref_name }} ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: generated-test-app
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and launch a generated app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r generated.apk
            adb shell am start -W -n com.webapper.gen.a0123456789abcdef/com.webapper.template.MainActivity
            sleep 25
            adb shell pidof com.webapper.gen.a0123456789abcdef
            adb logcat -d | grep -i -E "gecko|webapper" | tail -40 || true
            adb exec-out screencap -p > screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot
          path: screen.png
